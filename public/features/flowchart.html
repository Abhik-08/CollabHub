<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollabHub | Advanced Diagram & Flowchart Workspace</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="../assets/css/flowchart.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- PDF Export library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <i class="fa-solid fa-shapes"></i> CollabDraw
        </div>
        <div class="header-menu">
            <button id="importJsonBtn" class="btn-secondary" title="Import JSON flowchart project"><i class="fa-solid fa-file-import"></i> Import Project</button>
            <input type="file" id="importJsonInput" accept=".json" style="display: none;" aria-label="Import Project JSON">
            
            <div class="dropdown">
                <button class="btn-secondary dropdown-toggle" aria-haspopup="true" aria-expanded="false"><i class="fa-solid fa-file-export"></i> Export</button>
                <div class="dropdown-content">
                    <button id="exportPngBtn" class="dropdown-item"><i class="fa-solid fa-file-image"></i> Export (PNG)</button>
                    <button id="exportSvgBtn" class="dropdown-item"><i class="fa-solid fa-code"></i> Export (SVG)</button>
                    <button id="exportPdfBtn" class="dropdown-item"><i class="fa-solid fa-file-pdf"></i> Export (PDF)</button>
                    <button id="exportXmlBtn" class="dropdown-item"><i class="fa-solid fa-file-excel"></i> Export (Draw.io XML)</button>
                    <button id="exportJsonBtn" class="dropdown-item"><i class="fa-solid fa-file-code"></i> Save JSON</button>
                </div>
            </div>
            
            <button id="loadDraftBtn" class="btn-secondary" title="Load autorecovered draft"><i class="fa-solid fa-rotate-left"></i> Load Draft</button>
            <button id="saveDraftBtn" class="btn-primary" title="Save draft locally"><i class="fa-solid fa-save"></i> Save</button>
        </div>
        <div class="room-controls">
            <input type="text" id="roomInput" value="flowchart123" placeholder="Room ID" aria-label="Room ID">
            <button id="joinBtn" class="btn-primary">Join Room</button>
        </div>
    </header>

    <div class="ribbon">
        <!-- Group 1: Canvas Modes & History -->
        <div class="tool-group">
            <button id="mode-select" class="tool-btn active" title="Select/Move Tool"><i class="fa-solid fa-arrow-pointer"></i> Select</button>
            <button id="mode-connect" class="tool-btn" title="Connector Tool"><i class="fa-solid fa-share-nodes"></i> Connect</button>
            <div class="separator-mini"></div>
            <button id="undoBtn" class="tool-btn" title="Undo (Ctrl+Z)"><i class="fa-solid fa-undo"></i></button>
            <button id="redoBtn" class="tool-btn" title="Redo (Ctrl+Y)"><i class="fa-solid fa-redo"></i></button>
            <button id="delete-btn" class="tool-btn text-red" title="Delete Selected"><i class="fa-solid fa-trash"></i></button>
        </div>
        
        <div class="separator"></div>

        <!-- Group 2: Connector Style -->
        <div class="tool-group">
            <span class="group-label">Connector style</span>
            <select id="connectorStyleSelect" aria-label="Connector Line Style">
                <option value="orthogonal">Orthogonal</option>
                <option value="straight">Straight</option>
                <option value="curved">Curved</option>
            </select>
        </div>

        <div class="separator"></div>
        
        <!-- Group 3: Formatting & Borders -->
        <div class="tool-group id-properties" id="properties-panel" style="opacity: 0.5; pointer-events: none;">
            <div class="prop-item">
                <label for="color-picker">Fill</label>
                <input type="color" id="color-picker" value="#aaddff" title="Fill Color">
            </div>
            <div class="prop-item">
                <label for="border-color-picker">Border</label>
                <input type="color" id="border-color-picker" value="#333333" title="Border Color">
            </div>
            <div class="prop-item">
                <label for="border-width-picker">Width</label>
                <input type="number" id="border-width-picker" value="2" min="1" max="10" style="width: 45px;" title="Border Width">
            </div>
            <div class="prop-item">
                <label for="text-input">Text</label>
                <input type="text" id="text-input" placeholder="Label...">
            </div>
            <div class="prop-item">
                <label for="font-family-picker">Font</label>
                <select id="font-family-picker">
                    <option value="Inter">Inter</option>
                    <option value="Arial">Arial</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Times New Roman">Times</option>
                </select>
            </div>
            <div class="prop-item">
                <label for="font-size-picker">Size</label>
                <input type="number" id="font-size-picker" value="14" min="8" max="72" style="width: 45px;">
            </div>
            <div class="prop-item">
                <label for="font-color-picker">Color</label>
                <input type="color" id="font-color-picker" value="#333333">
            </div>
            <div class="prop-item">
                <label for="text-align-picker">Align</label>
                <select id="text-align-picker">
                    <option value="center">Center</option>
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                </select>
            </div>
        </div>

        <div class="separator"></div>

        <!-- Group 4: Align & Spacing -->
        <div class="tool-group">
            <span class="group-label">Arrange</span>
            <button id="alignLeftBtn" class="tool-btn" title="Align Left"><i class="fa-solid fa-align-left"></i></button>
            <button id="alignRightBtn" class="tool-btn" title="Align Right"><i class="fa-solid fa-align-right"></i></button>
            <button id="alignTopBtn" class="tool-btn" title="Align Top"><i class="fa-solid fa-align-justify"></i></button>
            <button id="alignBottomBtn" class="tool-btn" title="Align Bottom"><i class="fa-solid fa-align-justify"></i></button>
            <button id="equalSpacingBtn" class="tool-btn" title="Equal Spacing"><i class="fa-solid fa-arrows-left-right"></i></button>
            <button id="autoLayoutBtn" class="tool-btn" title="Auto Grid Layout"><i class="fa-solid fa-magic"></i></button>
        </div>
        
        <!-- Group 5: Zoom & Panning controls -->
        <div class="tool-group" style="margin-left: auto;">
            <button id="snapToggleBtn" class="tool-btn active" title="Toggle Grid Snap"><i class="fa-solid fa-magnet"></i></button>
            <button id="gridToggleBtn" class="tool-btn active" title="Toggle Grid Visible"><i class="fa-solid fa-grid-3x3"></i></button>
            <div class="separator-mini"></div>
            <button id="zoomOutBtn" class="tool-btn" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            <span id="zoomLevelDisplay">100%</span>
            <button id="zoomInBtn" class="tool-btn" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
            <button id="zoomResetBtn" class="tool-btn" title="Reset Zoom">1:1</button>
            <button id="expand-btn" class="tool-btn" title="Expand Canvas Sheet">
                <i class="fa-solid fa-expand"></i> Expand
            </button>
        </div>
    </div>

    <div class="workspace">
        <!-- Sidebar shapes tray -->
        <div class="sidebar">
            <div class="sidebar-title">Standard shapes</div>
            <div class="shape-item" draggable="true" data-shape="rectangle"><div class="icon-box rect"></div><span>Process</span></div>
            <div class="shape-item" draggable="true" data-shape="diamond"><div class="icon-box diamond"></div><span>Decision</span></div>
            <div class="shape-item" draggable="true" data-shape="oval"><div class="icon-box oval"></div><span>Start/End</span></div>
            <div class="shape-item" draggable="true" data-shape="parallelogram"><div class="icon-box para"></div><span>Input</span></div>
            
            <div class="sidebar-title">Diagram objects</div>
            <div class="shape-item" draggable="true" data-shape="database"><div class="icon-box database-icon"></div><span>Database</span></div>
            <div class="shape-item" draggable="true" data-shape="cloud"><div class="icon-box cloud-icon"></div><span>Cloud</span></div>
            <div class="shape-item" draggable="true" data-shape="user"><div class="icon-box user-icon"></div><span>User Role</span></div>
            <div class="shape-item" draggable="true" data-shape="server"><div class="icon-box server-icon"></div><span>Rack Server</span></div>
            <div class="shape-item" draggable="true" data-shape="document"><div class="icon-box document-icon"></div><span>Document</span></div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="flowchart-canvas" width="1200" height="800"></canvas>
            <textarea id="node-text-editor" aria-label="Node Text Editor"></textarea>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous"></script>
    <script src="../assets/js/flowchart.js"></script>
</body>
</html>
